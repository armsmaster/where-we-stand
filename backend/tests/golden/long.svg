<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690"><rect x="0" y="0" width="1200" height="690" fill="#FFFFFF"/><text x="40" y="60.61" font-family="Arimo" font-size="28" font-weight="600" fill="#111111">Где мы находимся</text><rect x="280" y="140.8" width="880" height="6" rx="3" fill="#F1EFE8"/><line x1="698" y1="143.8" x2="720" y2="143.8" stroke="#888780" stroke-width="1.5" stroke-linecap="round"/><circle cx="720" cy="143.8" r="6" fill="#378ADD"/><circle cx="698" cy="143.8" r="4.5" fill="none" stroke="#888780" stroke-width="1.5"/><text x="40" y="149.3" font-family="Arimo" font-size="16" font-weight="500" fill="#111111">Индекс МосБиржи полной доходности брутто, пунктов</text><text x="720" y="132.8" font-family="Arimo" font-size="15" font-weight="500" fill="#111111" text-anchor="middle">5 000</text><text x="280" y="159.8" font-family="Arimo" font-size="13" font-weight="400" fill="#777777">1 000</text><text x="1160" y="159.8" font-family="Arimo" font-size="13" font-weight="400" fill="#777777" text-anchor="end">9 000</text><circle cx="46" cy="222.58" r="6" fill="#378ADD"/><text x="59" y="227.08" font-family="Arimo" font-size="13" font-weight="400" fill="#777777">сейчас</text><circle cx="124.99" cy="222.58" r="4.5" fill="none" stroke="#888780" stroke-width="1.5"/><text x="136.49" y="227.08" font-family="Arimo" font-size="13" font-weight="400" fill="#777777">неделю назад</text><text x="241.85" y="227.08" font-family="Arimo" font-size="13" font-weight="400" fill="#777777">шкала — диапазон за 12 месяцев</text><text x="40" y="255.61" font-family="Arimo" font-size="12" font-weight="400" fill="#777777">Очень длинная сноска, которая заведомо не помещается в одну строку и обязана быть перенесена по словам без обрезки и без выхода за пределы области отрисовки. Для того, чтобы проверка</text><text x="40" y="271.81" font-family="Arimo" font-size="12" font-weight="400" fill="#777777">была настоящей, текст заведомо длиннее той ширины, которая остаётся под него на холсте шириной 1200 точек при полях сорок точек с каждой стороны.</text><text x="40" y="300.01" font-family="Arimo" font-size="12" font-weight="400" fill="#777777">Источник: Мосбиржа, расчёты редакции. Данные на 12.03.2026</text></svg>