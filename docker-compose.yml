services:
  chart:
    build:
      context: .
      args:
        BUILD_VERSION: "1.0.0"
    image: where-do-we-stand:1.0.0
    ports:
      - "${WDWS_PORT:-8080}:8000"
    volumes:
      - ./presets:/presets:ro
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
